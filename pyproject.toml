[project]
name = "sandboxmcp"
version = "0.1.0"
description = "Sandboxed DevOps & Execution MCP server: safe DB access, log tailing, and isolated Docker test runs for AI agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.11.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "sqlalchemy>=2.0",
    "docker>=7.1",
    "python-dotenv>=1.1",
]

[project.scripts]
sandboxmcp = "sandboxmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxmcp"]
